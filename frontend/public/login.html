<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/api/v1/css/login.css">
    <link rel="stylesheet" href="/api/v1/css/navbar.css">
    <link rel="stylesheet" href="/api/v1/css/footer.css">
</head>

<body>

    <!-- Contenitore Navbar condivisa -->
    <div id="navbar">
        <script>
            fetch('/api/v1/components/navbar.html')
                .then(response => response.text())
                .then(html => document.getElementById('navbar').innerHTML = html);
        </script>
    </div>

    <!-- Modulo di autenticazione utente (POST verso il Gateway) -->
    <div class="login-wrapper">
        <div class="login-box">
            <h2>Login</h2>
            <form action="/api/v1/login" method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Accedi</button>
            </form>
        </div>
    </div>

    <!-- Contenitore Footer condiviso -->
    <div id="footer">
        <script>
            fetch('/api/v1/components/footer.html')
                .then(response => response.text())
                .then(html => document.getElementById('footer').innerHTML = html);
        </script>
    </div>

</body>

</html>
