<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/api/v1/css/index.css">
    <link rel="stylesheet" href="/api/v1/css/navbar.css">
    <link rel="stylesheet" href="/api/v1/css/footer.css">
    <style>
        /* ===== Pulsante persistenza ===== */
        #btn-persistance {
            display: none; /* Visibile solo dopo il login */
            margin-top: 28px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #4a6fa5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #btn-persistance:hover  { background-color: #3a5a8c; }
        #btn-persistance:active { background-color: #2e4a73; }

        /* ===== Pannello risposta JSON ===== */
        #persistance-result {
            display: none;
            margin-top: 24px;
            padding: 20px 28px;
            background: #fff;
            border: 1px solid #c9d6e8;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(74,111,165,.12);
            text-align: left;
            max-width: 540px;
            width: 100%;
        }
        #persistance-result h2 {
            font-size: 16px;
            color: #4a6fa5;
            margin-bottom: 12px;
        }
        #persistance-result pre {
            font-family: "Courier New", monospace;
            font-size: 14px;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
        }
        #persistance-error {
            margin-top: 16px;
            color: #c0392b;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Contenitore Navbar: popolato da auth.js -->
    <div id="navbar"></div>

    <!-- Contenitore principale della Home page -->
    <div class="container">
        <h1>Welcome to My App</h1>
        <p>This is the home page of your application.</p>

        <!-- Pulsante per interrogare il servizio di persistenza e visualizzare il JSON (visibile solo dopo login) -->
        <button id="btn-persistance" type="button" style="display: none;">Richiedi Dati Persistenza (JSON)</button>

        <!-- Messaggio di errore se il servizio non è raggiungibile -->
        <div id="persistance-error" style="display: none;"></div>

        <!-- Pannello con output JSON formattato -->
        <div id="persistance-result">
            <h2>Risposta JSON:</h2>
            <pre id="persistance-json"></pre>
        </div>
    </div>

    <!-- Contenitore Footer: popolato da auth.js -->
    <div id="footer"></div>

    <script src="/api/v1/js/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('btn-persistance');
            const resultBox = document.getElementById('persistance-result');
            const jsonOutput = document.getElementById('persistance-json');
            const errorBox = document.getElementById('persistance-error');

            if (btn) {
                btn.addEventListener('click', async () => {
                    const originalText = btn.textContent;
                    btn.textContent = 'Caricamento...';
                    btn.disabled = true;
                    if (errorBox) errorBox.style.display = 'none';

                    try {
                        const res = await fetch('/api/v1/persistance', {
                            method: 'GET',
                            credentials: 'include',
                            headers: { 'Accept': 'application/json' }
                        });

                        if (!res.ok) {
                            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                        }

                        const data = await res.json();
                        jsonOutput.textContent = JSON.stringify(data, null, 2);
                        resultBox.style.display = 'block';
                    } catch (err) {
                        console.error('Errore chiamata persistenza:', err);
                        if (errorBox) {
                            errorBox.textContent = 'Errore durante la richiesta: ' + err.message;
                            errorBox.style.display = 'block';
                        }
                    } finally {
                        btn.textContent = originalText;
                        btn.disabled = false;
                    }
                });
            }
        });
    </script>
</body>

</html>
